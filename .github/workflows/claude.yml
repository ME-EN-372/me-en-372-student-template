# Lets students summon Claude by writing "@claude ..." in an issue, an issue
# comment, a pull-request comment, or a PR review comment.
#
# Requires one repository secret, CLAUDE_CODE_OAUTH_TOKEN, set on every
# student repository (there is no organization secret; the course repo holds
# its own copy of the same token). It comes from the course's Claude
# subscription (`claude setup-token`). Extra usage past the subscription's
# allowance is NOT enabled at the organization level as of 2026-09-12: every
# rate-limit record says overage rejected, org_level_disabled, so the five
# hour and seven day windows are hard walls and a ping that lands on one fails
# until the reset. There is no separate Anthropic API key to mint or rotate.
# See ../../SETUP.md for how the course instantiates this.
#
# ---------------------------------------------------------------------------
# THIS FILE IS APPLIED BY HAND, and updated by hand when it changes.
#
# GitHub refuses any push touching `.github/workflows/` from a token without the
# Workflows permission, and the course's sync token deliberately does not have
# it: that permission would let an "@claude" comment install a workflow into
# every repository generated from this template, all of which share one
# CLAUDE_CODE_OAUTH_TOKEN.
#
# Edit this file here anyway. `scripts/sync_student_template.py` diffs this copy
# against the template repository's on every run, fails if they differ, and
# prints the one `gh api` command that applies it. For the repositories that
# already exist, `scripts/solutions/distribute_to_student_repos.py
# --with-workflow` pushes it from a staff `gh auth` session, printing the diff
# first. Students cannot change it: a push ruleset on each repository refuses
# any push touching .github/**, CLAUDE.md, homework/solutions/** or course/**
# from anyone but staff (docs/solution-guides-in-student-repos.md).
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# Model selection, in one paragraph
#
#   @claude                     -> Opus at high effort (the default since 2026-09-12)
#   @claude+fable               -> Fable, the largest model (5.1 today; slowest,
#                                  and it shares the course's own Fable allowance;
#                                  when that is spent the job retries on Opus)
#   @claude+sonnet              -> Sonnet   (faster; fine for most questions)
#   @claude+haiku               -> Haiku    (cheapest; fine for a question that
#                                  does not touch a homework problem)
#   @claude+opus:xhigh          -> Opus at the highest effort a student can ask for
#
# Model names are FAMILY ALIASES, not pinned ids: `opus` resolves to the
# latest Opus at run time, so the course never has to ship a commit to pick up
# a new release. (`claude --help`: "Provide an alias for the latest model".)
#
# Effort is only sent to families that accept it, see EFFORT_FAMILIES below.
# A bare `@claude` runs Opus at DEFAULT_EFFORT; `@claude+haiku` carries no
# effort flag at all, which is correct: Haiku has no effort parameter.
#
# Anything outside ALLOWED_FAMILIES falls back to the default and says so in
# the job summary rather than failing, because a student should get an answer,
# not a red X. This mirrors the course repo's selector with two deliberate
# differences, both about ninety repositories sharing one credential: an effort
# ceiling, and no bypassPermissions. Both are single-line knobs, documented at
# their site.
# ---------------------------------------------------------------------------

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize runs per issue or PR so a burst of comments queues instead of
# racing: two concurrent runs pushing to the same branch is how work gets
# clobbered. Not cancel-in-progress, because a cancelled run can leave a
# half-finished edit.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Only wake up when someone actually addressed Claude. Without this guard
    # every comment in the repo would start a billed run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Bounds one run, not the semester. Student work is short; a run that needs
    # more than half an hour has usually gone wrong rather than gone deep.
    timeout-minutes: 30
    env:
      # Retry on the fallback model after ANY failure, not only a spent
      # allowance. Off in production. "true" is how the retry path was
      # exercised on the scratch repository (a nonexistent model as the
      # primary fails in seconds and the retry then runs for real).
      RETRY_ON_ANY_FAILURE: "false"
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read this repo's CI results when a check fails
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Copilot-style model selector: @claude+<model>[:<effort>]
      # The FULL tag is passed to the action as its trigger phrase. That is
      # required, because the action only accepts whitespace or punctuation
      # after the phrase, not "+". Every decision this step makes is written to
      # the job summary so a student can see which model answered them and why.
      - name: Parse model selector tag
        id: select
        env:
          # Read through env, never interpolated into the script body: comment
          # text is untrusted input and ${{ }} inside run: is a shell injection.
          TRIGGER_TEXT: ${{ github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
          TRIGGER_USER: ${{ github.event.comment.user.login || github.event.issue.user.login || github.actor }}

          # ---- the cost knobs -----------------------------------------------
          # Bare "@claude" resolves to this. A FAMILY ALIAS, not a pinned id:
          # the CLI resolves it to the latest Opus at run time, so a new
          # release is picked up without a commit, and, more importantly, a
          # bare "@claude" and an explicit "@claude+opus" can never drift
          # onto different models. Opus replaced Sonnet as the default on
          # 2026-09-12 (Sonnet had replaced Haiku on 2026-09-08): ten days of
          # student traffic, 236 runs across 83 repositories with 4 of them
          # tagged, sat far below the subscription's allowance, and in the
          # 2026-09-12 pilot Opus at high effort found the same sign error
          # Sonnet had, added a check Sonnet did not (both given faces must
          # lie on the circle), and quoted nothing from the guide. About 2.5x
          # Sonnet's cost per ping at list price and roughly double the run
          # time (2 to 3 minutes against 1), which a student reading an issue
          # comment does not notice. docs/solution-guides-in-student-repos.md
          # has both pilots.
          DEFAULT_MODEL: opus
          # high, not medium: in the same pilot Opus at medium quoted "13
          # degrees" as an example of a bare answer, and that is the guide's
          # principal angle to the degree. One sample, but it is the failure
          # the guide rules exist to prevent, and at this traffic the token
          # cost of high over medium is noise.
          DEFAULT_EFFORT: high
          # Families a student may request. Fable (5.1 as of 2026-09-12; the
          # alias tracks the newest release, and @claude+fable-5.1 pins it) is
          # allowed at the instructor's direction (issue 99). It draws on the
          # same Fable allowance the course's own automation uses; when that
          # is spent the job retries on FALLBACK_MODEL, below. A TA who needs
          # to narrow this edits it here.
          ALLOWED_FAMILIES: "haiku sonnet opus fable"
          # Second attempt when the first dies of a spent allowance, the same
          # design as the course repo's workflow (docs/claude-yml-model-fallback.md
          # there). A family alias. Dropped when the primary is the same
          # family, since the allowance that ran out is the one the retry
          # would use: a bare "@claude" and "@claude+opus" never retry;
          # "@claude+fable", "@claude+sonnet" and "@claude+haiku" retry on
          # Opus. Empty string switches the retry off.
          FALLBACK_MODEL: opus
          # Families that accept an effort level at all. Sending --effort to a
          # model without the parameter is at best ignored and at worst an
          # error, so the flag is omitted rather than sent and hoped for.
          # Haiku is deliberately absent: Haiku 4.5 has no effort parameter.
          # Revisit if a future Haiku gains one.
          EFFORT_FAMILIES: "opus sonnet fable"
          # Effort ceiling: xhigh is open to students (instructor, 2026-09-12);
          # max stays for multi-hour course automation.
          MAX_EFFORT: xhigh
          # -------------------------------------------------------------------
        run: |
          set -euo pipefail

          # First tag in the text wins
          TAG=$(grep -oiE '@claude(\+[a-z0-9.-]*[a-z0-9])?(:[a-z]+)?' <<<"$TRIGGER_TEXT" | head -n1 || true)
          TAG=${TAG:-@claude}

          tag_lc=$(tr '[:upper:]' '[:lower:]' <<<"$TAG")
          rest=${tag_lc#@claude}
          effort_req=""
          if [[ "$rest" == *:* ]]; then
            effort_req=${rest##*:}
            rest=${rest%:*}
          fi
          model_req=${rest#+}
          notes=()

          # ---- model --------------------------------------------------------
          if [[ -z "$model_req" ]]; then
            model="$DEFAULT_MODEL"
          elif [[ "$model_req" != *[0-9]* ]]; then
            # Unversioned family name (haiku, sonnet, opus) -> pass through as a
            # CLI alias, which resolves to the latest model of that family
            model=${model_req#claude-}
          else
            model=${model_req//./-}
            [[ "$model" == claude-* ]] || model="claude-$model"
          fi

          # "claude-haiku-4-5-20251001" -> "haiku"; "sonnet" -> "sonnet"
          family_of() { local f=${1#claude-}; echo "${f%%-*}"; }
          family=$(family_of "$model")

          if [[ " $ALLOWED_FAMILIES " != *" $family "* ]]; then
            notes+=("Model \`$family\` is not enabled for student repositories (allowed: $ALLOWED_FAMILIES), so the default answered instead. A TA can widen \`ALLOWED_FAMILIES\` in \`.github/workflows/claude.yml\` if a task genuinely needs it.")
            model="$DEFAULT_MODEL"
            family=$(family_of "$model")   # derived, so DEFAULT_MODEL stays the only knob
            effort_req=""   # don't leave "max" attached to the fallback
          fi

          # ---- effort -------------------------------------------------------
          rank() { case "$1" in low) echo 1;; medium) echo 2;; high) echo 3;; xhigh) echo 4;; max) echo 5;; *) echo 0;; esac; }

          if [[ -z "$effort_req" ]]; then
            effort="$DEFAULT_EFFORT"
          elif [[ "$(rank "$effort_req")" == 0 ]]; then
            notes+=("Unknown effort level \`:$effort_req\`, so \`$DEFAULT_EFFORT\` was used. Valid levels: low, medium, high, xhigh.")
            effort="$DEFAULT_EFFORT"
          elif (( $(rank "$effort_req") > $(rank "$MAX_EFFORT") )); then
            notes+=("Effort \`$effort_req\` is above this course's ceiling, so it was clamped to \`$MAX_EFFORT\`.")
            effort="$MAX_EFFORT"
          else
            effort="$effort_req"
          fi

          # ---- assemble -----------------------------------------------------
          # Only send --effort to a family that has the parameter. Haiku does
          # not, so "@claude+haiku" gets "--model haiku" with no effort flag,
          # while the default path is "--model opus --effort high".
          args="--model $model"
          if [[ " $EFFORT_FAMILIES " == *" $family "* ]]; then
            args="$args --effort $effort"
          else
            if [[ -n "$effort_req" ]]; then
              notes+=("\`$family\` has no effort setting, so \`:$effort_req\` was ignored. Ask for a model that does, for example \`@claude+sonnet:$effort_req\`.")
            fi
            effort="n/a"
          fi

          # ---- fallback -----------------------------------------------------
          # The retry carries the requested effort, or DEFAULT_EFFORT when the
          # primary had none (Haiku). --fallback-model is the CLI's own
          # in-session switch for an overloaded model; the job-level retry
          # below is for a spent allowance, which the CLI does not cover.
          fallback="$FALLBACK_MODEL"
          fallback_args=""
          if [[ -n "$fallback" && "$(family_of "$fallback")" == "$family" ]]; then
            fallback=""
          fi
          if [[ -n "$fallback" ]]; then
            fb_effort=$effort
            [[ "$(rank "$fb_effort")" == 0 ]] && fb_effort=$DEFAULT_EFFORT
            fallback_args="--model $fallback --effort $fb_effort"
            args="$args --fallback-model $fallback"
          fi

          # ---- log the intermediate pieces ----------------------------------
          echo "tag=$TAG  requested_model=${model_req:-<default>}  requested_effort=${effort_req:-<default>}"
          echo "resolved: $args"
          if [[ -n "$fallback" ]]; then
            echo "if the allowance for $model is spent, the job retries with: $fallback_args"
          fi

          {
            echo "### Claude run settings"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Model | \`$model\` (latest of that family) |"
            echo "| Effort | \`$effort\` |"
            echo "| Triggered by | @$TRIGGER_USER |"
            echo "| If the allowance is spent | ${fallback:+retry on \`$fallback\`}${fallback:-no retry (same model)} |"
            echo
            for n in "${notes[@]}"; do echo "> [!NOTE]"; echo "> $n"; echo; done
            echo "A bare \`@claude\` is Opus at high effort. \`@claude+fable\` is the largest model and the slowest; \`@claude+sonnet\` and \`@claude+haiku\` are faster for a quick question. \`:low\`, \`:medium\`, \`:high\` or \`:xhigh\` after a model name sets its effort (Haiku has none)."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "phrase=$TAG"
            echo "model_args=$args"
            echo "model=$model"
            echo "effort=$effort"
            echo "fallback_model=$fallback"
            echo "fallback_args=$fallback_args"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Homework solution guides.
      #
      # homework/solutions/hwNN-solution-guide.pdf is the course's solution
      # guide for each set, encrypted with AES-256. The password for each is a
      # repository secret, HWNN_SOLUTIONS_PASSWORD, set by the course from its
      # keystore. This step opens every guide whose secret is present and
      # writes the markdown source attached inside it to the runner's temp
      # directory, OUTSIDE the checkout, so nothing decrypted can be committed
      # or pushed by a later step. It prints a count and nothing else: no
      # password, no line of a guide. CLAUDE.md tells Claude how it may use
      # the guides (check the student's work against them; never state an
      # answer before the guide's release date; never reveal a guide or a
      # password). continue-on-error so that a broken unlock still leaves the
      # student with an answer, just one without the guide.
      # ---------------------------------------------------------------------
      - name: Unlock the solution guides
        continue-on-error: true
        env:
          HW01_SOLUTIONS_PASSWORD: ${{ secrets.HW01_SOLUTIONS_PASSWORD }}
          HW02_SOLUTIONS_PASSWORD: ${{ secrets.HW02_SOLUTIONS_PASSWORD }}
          HW03_SOLUTIONS_PASSWORD: ${{ secrets.HW03_SOLUTIONS_PASSWORD }}
          HW04_SOLUTIONS_PASSWORD: ${{ secrets.HW04_SOLUTIONS_PASSWORD }}
          HW05_SOLUTIONS_PASSWORD: ${{ secrets.HW05_SOLUTIONS_PASSWORD }}
          HW06_SOLUTIONS_PASSWORD: ${{ secrets.HW06_SOLUTIONS_PASSWORD }}
          HW07_SOLUTIONS_PASSWORD: ${{ secrets.HW07_SOLUTIONS_PASSWORD }}
          HW08_SOLUTIONS_PASSWORD: ${{ secrets.HW08_SOLUTIONS_PASSWORD }}
          HW09_SOLUTIONS_PASSWORD: ${{ secrets.HW09_SOLUTIONS_PASSWORD }}
          HW10_SOLUTIONS_PASSWORD: ${{ secrets.HW10_SOLUTIONS_PASSWORD }}
          HW11_SOLUTIONS_PASSWORD: ${{ secrets.HW11_SOLUTIONS_PASSWORD }}
          HW12_SOLUTIONS_PASSWORD: ${{ secrets.HW12_SOLUTIONS_PASSWORD }}
          HW13_SOLUTIONS_PASSWORD: ${{ secrets.HW13_SOLUTIONS_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pypdf cryptography
          python3 - <<'EOF'
          import os
          from pathlib import Path
          from pypdf import PdfReader

          out = Path(os.environ["RUNNER_TEMP"]) / "solution-guides"
          out.mkdir(parents=True, exist_ok=True)
          unlocked, failed = 0, []
          for n in range(1, 14):
              password = os.environ.get(f"HW{n:02d}_SOLUTIONS_PASSWORD", "")
              src = Path(f"homework/solutions/hw{n:02d}-solution-guide.pdf")
              if not password or not src.exists():
                  continue
              reader = PdfReader(str(src))
              if not reader.decrypt(password):
                  failed.append(f"hw{n:02d}")
                  continue
              written = False
              for name, data in reader.attachments.items():   # the markdown source, attached at build time
                  if name.endswith(".md"):
                      (out / name).write_bytes(data[0] if isinstance(data, list) else data)
                      written = True
              if not written:   # older guide with no attachment: fall back to the page text
                  text = "\n".join((p.extract_text() or "") for p in reader.pages)
                  (out / f"hw{n:02d}-solution-guide.md").write_text(text, encoding="utf-8")
              unlocked += 1
          print(f"unlocked {unlocked} of 13")
          if failed:
              print("could not open: " + ", ".join(failed))
          EOF

      - name: Run Claude
        id: claude
        # The job decides what to do with a failure in the steps below, so
        # this one must not end the job by itself.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # Where the unlock step put the guides. Outside the checkout;
          # CLAUDE.md names the same path. Step level, not job level: the
          # runner context is not available in a job-level env, and GitHub
          # refuses the whole file when it sees it there.
          SOLUTION_GUIDES_DIR: ${{ runner.temp }}/solution-guides
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The exact tag found in the trigger text (@claude, @claude+sonnet:high, ...)
          trigger_phrase: ${{ steps.select.outputs.phrase }}

          # Both off, deliberately. Claude reads the unlocked solution guides
          # during a run, so its tool calls and tool results carry guide text.
          # show_full_output would print every turn, including those results,
          # into the job log, and display_report renders the turns into the
          # step summary; a student can read both. What the student sees is
          # the reply Claude posts, plus the selector step's summary above.
          display_report: false
          show_full_output: false

          # Let Claude read this repo's CI results when a student asks why a
          # check is failing.
          additional_permissions: |
            actions: read

          # --model / --effort come from the "Parse model selector tag" step.
          #
          # acceptEdits, NOT bypassPermissions (which is what the course repo
          # uses): Claude may read and edit files and open commits or PRs without
          # asking, but arbitrary shell stays gated. The course's shared
          # CLAUDE_CODE_OAUTH_TOKEN is in this runner's environment, and one
          # `env`-style command is all it takes to read it out. GitHub masks
          # the literal secret in logs, not a transformed copy of it. In the
          # course repo only the teaching team can comment; here anyone with
          # access to the repo can. A TA who needs shell for one repo can add
          # specific commands (for example --allowedTools 'Bash(python -m pytest:*)')
          # rather than opening it wholesale.
          claude_args: |
            ${{ steps.select.outputs.model_args }}
            --permission-mode acceptEdits

      # ---------------------------------------------------------------------
      # Fallback: the same design as the course repo's workflow. Did the first
      # attempt die because its allowance was spent, or for some ordinary
      # reason? A failed run still writes its execution JSON and still sets
      # the execution_file output, and the answer is in the run's own error
      # records: an "api_error" result carrying HTTP 429, and a
      # rate_limit_event whose status is "rejected". Only those error records
      # are searched, never the transcript (which here also carries solution
      # guide text), so a comment that happens to discuss usage limits cannot
      # trigger a retry, and nothing from the transcript is printed. The step
      # emits "note": one line for the next step to append to the first
      # attempt's comment; empty means the comment is left alone.
      # ---------------------------------------------------------------------
      - name: Check whether the model ran out of credits
        id: billing
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          PRIMARY_MODEL_RESOLVED: ${{ steps.select.outputs.model }}
          FALLBACK_MODEL_RESOLVED: ${{ steps.select.outputs.fallback_model }}
        run: |
          python3 - <<'PY'
          import json, os, re

          path = os.environ.get("EXECUTION_FILE", "")
          primary = os.environ.get("PRIMARY_MODEL_RESOLVED", "") or "the primary model"
          fallback = os.environ.get("FALLBACK_MODEL_RESOLVED", "")
          retry_any = os.environ.get("RETRY_ON_ANY_FAILURE", "false").lower() == "true"

          # The CLI's own wording for a spent allowance, plus the API's
          # credit-balance wording.
          BILLING = re.compile(
              r"out of (usage |extra )?credits|out of extra usage"
              r"|credit balance (is )?too low|(reached|hit) your .{0,40}limit"
              r"|usage limit reached|requires usage credits|out of usage"
              r"|seat type doesn.t include usage|usage allocation has been disabled"
              r"|monthly spend limit",
              re.I,
          )

          messages = []
          if path and os.path.isfile(path):
              try:
                  messages = json.load(open(path))
              except Exception as exc:
                  print(f"Could not parse the execution file: {exc}")
          else:
              print(f"No execution file to inspect (execution_file={path!r})")

          billing = False
          reason = "the failure does not look like a spent allowance"

          for m in messages:
              if m.get("type") == "rate_limit_event":
                  info = m.get("rate_limit_info") or {}
                  if info.get("status") == "rejected":
                      billing = True
                      reason = (
                          f"rate_limit_event rejected: {info.get('rateLimitType')}"
                          f" (overage {info.get('overageStatus')}"
                          f"/{info.get('overageDisabledReason')})"
                      )

          results = [m for m in messages if m.get("type") == "result"]
          if results and results[-1].get("is_error"):
              last = results[-1]
              text = " ".join(str(last.get(k, "")) for k in ("result", "errors"))
              status = last.get("api_error_status")
              if status in (402, 429) or BILLING.search(text):
                  billing = True
                  reason = f"HTTP {status}: {last.get('result') or last.get('errors')}"

          if not messages:
              reason = "no execution file, so the cause is unknown"

          retry = bool(fallback) and (billing or retry_any)
          if not fallback:
              reason += "; no fallback model is configured"
          elif retry_any and not billing:
              reason += "; retrying anyway because RETRY_ON_ANY_FAILURE is true"

          if billing and retry:
              note = (f"Out of usage credits for `{primary}`. Retrying with"
                      f" `{fallback}` in this same job; the retry posts its own"
                      " progress comment in this thread.")
          elif billing:
              note = (f"Out of usage credits for `{primary}`, and no different"
                      " fallback model is configured, so there is no retry.")
          elif retry:
              note = (f"The `{primary}` attempt failed with something other"
                      f" than a spent allowance. Retrying with `{fallback}` in"
                      " this same job (RETRY_ON_ANY_FAILURE is on); the retry"
                      " posts its own progress comment in this thread.")
          else:
              note = ""

          reason = re.sub(r"\s+", " ", reason).strip()[:300]
          note = re.sub(r"\s+", " ", note).strip()
          print(f"Allowance spent: {billing}")
          print(f"Retry with {fallback or '(none)'}: {retry}")
          print(f"Reason: {reason}")
          print(f"Note: {note or '(none)'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"retry={'true' if retry else 'false'}\n")
              fh.write(f"reason={reason}\n")
              fh.write(f"note={note}\n")
          PY

      # The first attempt's comment currently ends at "Claude encountered an
      # error". Append one line saying why and what the job is doing about it,
      # so the thread explains itself while the retry spins up. The comment is
      # found by the run link it carries: at this point only the first attempt
      # has posted a comment holding this run's id. On
      # pull_request_review_comment events the tracking comment is a reply in
      # the review thread, which lives on a different endpoint than issue and
      # PR conversation comments. Editing either needs the write permissions
      # declared at the top of the job.
      - name: Explain the failure on the first attempt's comment
        if: ${{ !cancelled() && steps.billing.outputs.note != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ steps.billing.outputs.note }}
          RUN_MARK: /actions/runs/${{ github.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_review_comment" ]]; then
            number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            list="repos/$GITHUB_REPOSITORY/pulls/$number/comments"
            edit="repos/$GITHUB_REPOSITORY/pulls/comments"
          else
            number=$(jq -r '.issue.number // .pull_request.number' "$GITHUB_EVENT_PATH")
            list="repos/$GITHUB_REPOSITORY/issues/$number/comments"
            edit="repos/$GITHUB_REPOSITORY/issues/comments"
          fi
          comment_id=$(gh api --paginate "$list" \
            --jq '.[] | select(.user.type == "Bot") | select(.body | contains(env.RUN_MARK)) | .id' \
            | head -n1)
          if [[ -z "$comment_id" ]]; then
            echo "No comment from this run found under $list, so there is nothing to annotate."
            exit 0
          fi
          body=$(gh api "$edit/$comment_id" --jq .body)
          printf -v new_body '%s\n\n> [!WARNING]\n> %s' "$body" "$NOTE"
          gh api -X PATCH "$edit/$comment_id" -f body="$new_body" --jq .id >/dev/null
          echo "Annotated comment $comment_id: $NOTE"

      # The first attempt strips checkout's auth header and bakes its own app
      # token into origin's URL, and the action revokes that token on step
      # exit, so the retry's first git fetch would fail with "Invalid username
      # or token". Point origin back at the workflow token before the retry
      # (the fifth live firing in docs/claude-yml-model-fallback.md).
      - name: Restore git credentials for the retry
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        env:
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          server=${GITHUB_SERVER_URL#https://}
          git remote set-url origin \
            "https://x-access-token:$WORKFLOW_TOKEN@$server/$GITHUB_REPOSITORY.git"
          if git ls-remote origin HEAD >/dev/null 2>&1; then
            echo "origin authenticates again, so the retry can fetch."
          else
            echo "origin still cannot authenticate, so the retry will fail in branch setup."
          fi

      # Second attempt, on the fallback model. A fresh session: it posts its
      # own tracking comment and reads the task from the triggering comment
      # again, so the note below tells it to look at what the first attempt
      # already posted. Same inputs as the first attempt except the model,
      # which the parse step resolved; same acceptEdits, same guides, same
      # hidden output.
      - name: Run Claude on the fallback model
        id: fallback
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        uses: anthropics/claude-code-action@v1
        env:
          SOLUTION_GUIDES_DIR: ${{ runner.temp }}/solution-guides
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ steps.select.outputs.phrase }}
          # Without this line, the prompt below would switch the action into
          # automation ("agent") mode: no tracking comment, no thread context,
          # and the note below would become the entire task. track_progress
          # forces tag mode, which posts the tracking comment, reads the task
          # from the comment that triggered the run, and delivers the note
          # below as <custom_instructions>. It must sit HERE, on the step that
          # has prompt:, not on the first attempt, where it is a no-op.
          track_progress: true
          display_report: false
          show_full_output: false
          additional_permissions: |
            actions: read
          # The two attempts share one workspace, and the generated branch
          # name has minute resolution, so a retry that starts in the same
          # minute as the first attempt would regenerate the branch the first
          # attempt already created and die in branch setup. A disjoint prefix
          # removes the collision by construction.
          branch_prefix: claude/retry-
          prompt: |
            An earlier attempt at this same request ran on ${{ steps.select.outputs.model }} and stopped when that model's allowance ran out. You are the retry, running on ${{ steps.select.outputs.fallback_model }}. Read this thread first: if the earlier attempt already posted part of an answer, continue from it rather than starting over. Its progress comment is the one above yours that reports an error.
          claude_args: |
            ${{ steps.select.outputs.fallback_args }}
            --permission-mode acceptEdits

      # continue-on-error above hides the first attempt's failure from the job
      # status, so put it back when nothing succeeded.
      - name: Fail if no attempt succeeded
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' && steps.fallback.outcome != 'success' }}
        env:
          REASON: ${{ steps.billing.outputs.reason }}
          RETRIED: ${{ steps.billing.outputs.retry }}
        run: |
          echo "First attempt (${{ steps.select.outputs.model }}) failed: $REASON"
          if [[ "$RETRIED" == "true" ]]; then
            echo "Retry on ${{ steps.select.outputs.fallback_model }} also failed."
          fi
          exit 1

      # There is no longer an "Upload Claude execution log" step. That artifact
      # was the full turn-by-turn JSON of the run, tool results included, which
      # now means the text of the solution guides; a student can download any
      # artifact on their own repository. When a run needs reconstructing, a
      # TA re-runs the ping with show_full_output turned on in a copy of this
      # file on a branch, then removes it.
